<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 手繪風：冷鏈紙箱裝水蜜桃＋雪花 -->
  <g fill="none" stroke="#A5674F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 後方打開的箱蓋 -->
    <path d="M46 96 L34 66 L96 74 L96 96 Z" fill="#D9A05F"/>
    <path d="M154 96 L166 66 L104 74 L104 96 Z" fill="#D9A05F"/>
    <!-- 箱內陰影 -->
    <rect x="46" y="90" width="108" height="16" fill="#B9834E" stroke="none"/>
    <!-- 三顆探出頭的水蜜桃 -->
    <g>
      <circle cx="66" cy="88" r="21" fill="#F9BFAC"/>
      <circle cx="100" cy="84" r="23" fill="#F7B39E"/>
      <circle cx="134" cy="88" r="21" fill="#F9BFAC"/>
      <path d="M100 62 C100 54 102 49 106 44" stroke-width="4"/>
      <path d="M104 52 C112 38 128 36 134 41 C131 52 115 59 104 52 Z" fill="#9CCB86" stroke="#6FA25C"/>
    </g>
    <!-- 箱子正面（蓋住桃子下半） -->
    <rect x="40" y="102" width="120" height="62" rx="7" fill="#EDBE83"/>
    <!-- 打開的左右側蓋 -->
    <path d="M40 102 L16 84 L34 74 L52 96 Z" fill="#E2AE6F"/>
    <path d="M160 102 L184 84 L166 74 L148 96 Z" fill="#E2AE6F"/>
    <!-- 正面小桃子標誌 -->
    <circle cx="100" cy="133" r="13" fill="#F9BFAC"/>
    <path d="M100 122 C102 117 104 115 107 113" stroke-width="3.5"/>
  </g>
  <ellipse cx="60" cy="82" rx="7" ry="5" fill="#FCD9CC" opacity="0.9"/>
  <ellipse cx="93" cy="76" rx="8" ry="5" fill="#FCD9CC" opacity="0.9"/>
  <ellipse cx="128" cy="82" rx="7" ry="5" fill="#FCD9CC" opacity="0.9"/>
  <!-- 雪花 -->
  <g stroke="#8FC3E8" stroke-width="4.5" stroke-linecap="round">
    <path d="M172 26 L172 58"/>
    <path d="M158 34 L186 50"/>
    <path d="M186 34 L158 50"/>
    <path d="M172 30 L166 24 M172 30 L178 24"/>
    <path d="M172 54 L166 60 M172 54 L178 60"/>
  </g>
</svg>
